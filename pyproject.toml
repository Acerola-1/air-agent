[project]
name = "ipp-agent"
version = "0.0.1"
description = "Starter template for making a new agent LangGraph."
authors = [
    { name = "mojl", email = "mojl@mapuni.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.28,<0.8",
    "fastapi>=0.135,<1.0",
    "httpx>=0.28.1,<1.0",
    "langchain>=1.4.6,<2.0",
    "langchain-core>=1.6.11,<2.0",
    "langchain-mcp-adapters>=0.3.0,<1.0",
    "langchain-openai>=1.3.2,<2.0",
    "langchain-quickjs>=0.3.9,<1.0",
    "langfuse>=4.0,<5.0",
    "langgraph>=1.2.16,<2.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1,<4.0",
    "loguru>=0.7.3,<1.0",
    "openai>=2.38.0,<3.0",
    "psycopg[binary]==3.3.4",
    "pydantic>=2.13.4,<3.0",
    "pyyaml>=6.0.3,<7.0",
    "semantic-router>=0.1.15,<1.0",
    "uvicorn[standard]>=0.44,<1.0",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.39.3,<2.0",
    "langgraph-cli[inmem]>=0.4.31,<1.0",
    "mypy>=1.20.0,<2.0",
    "numpy>=2.4.6,<3.0",
    "pandas>=3.0.2,<4.0",
    "pytest>=9.0.2,<10.0",
    "pytest-timeout>=2.4.0,<3.0",
    "ruff>=0.9.10,<1.0",
]

[tool.uv]
# opentelemetry 全家桶锁定 1.42.1: 与当前官方 langchain/langgraph-api:3.13 镜像自带版本对齐,
# 避免容器内 uv pip install 覆盖镜像兼容版本导致 core-server 异常.
constraint-dependencies = [
    "opentelemetry-api==1.42.1",
    "opentelemetry-sdk==1.42.1",
    "opentelemetry-proto==1.42.1",
    "opentelemetry-exporter-otlp-proto-common==1.42.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.42.1",
    "opentelemetry-exporter-otlp-proto-http==1.42.1",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
"common.computation" = ["helpers.js"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"
