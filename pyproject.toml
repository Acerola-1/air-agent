[project]
name = "ipp-agent"
version = "0.0.1"
description = "Starter template for making a new agent LangGraph."
authors = [
    { name = "mojl", email = "mojl@mapuni.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135",
    "langgraph-checkpoint-sqlite>=3.1",
    "uvicorn[standard]>=0.44",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.39.3",
    "mypy>=1.11.1",
    "ruff>=0.6.1",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "basic_qa",
    "common",
    "common.config",
    "common.middleware",
    "data_analysis",
    "deep_research",
    "intelligent_analysis",
    "intelligent_report",
    "intelligent_tracing",
]
[tool.setuptools.package-dir]
"basic_qa" = "src/basic_qa"
"common" = "src/common"
"common.config" = "src/common/config"
"common.middleware" = "src/common/middleware"
"data_analysis" = "src/data_analysis"
"deep_research" = "src/deep_research"
"intelligent_analysis" = "src/intelligent_analysis"
"intelligent_report" = "src/intelligent_report"
"intelligent_tracing" = "src/intelligent_tracing"

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"
