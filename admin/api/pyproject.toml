[project]
name = "air-agent-admin-api"
version = "0.1.0"
description = "air_agent 用户后台管理服务：RBAC 权限、用户/角色/权限管理、行政区划关注城市"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "bcrypt>=4.2,<6.0",
    "fastapi>=0.135,<1.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "uvicorn[standard]>=0.44,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1,<1.0",
    "pytest>=9.0.2,<10.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.9.10,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入要求把 Depends/Query 等作为默认值，B008 会误报
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
