# ---------------------------------------------------------------------------
# Air Agent — Apple Container + Mcrich23/Container-Compose deployment spec
#
# Orchestration target: Apple Container (container CLI 1.2+) via
# `container-compose` (https://github.com/Mcrich23/Container-Compose).
# This project does NOT use Docker Desktop or docker compose.
#
# Day-to-day workflow (local development, recommended):
#   $ container-compose up -d        # starts ONLY postgres (langgraph-api is
#                                    # gated behind `profiles: [prod]`).
#   $ ./run-local.sh                 # venv langgraph-dev :2024 + Next :3000
#   $ container-compose down         # stops postgres (named volumes kept).
#
# Full-container staging / packaging:
#   $ container-compose up -d --build --profile prod
# ---------------------------------------------------------------------------

name: air-agent

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: air_agent
      POSTGRES_PASSWORD: air_agent_dev
      POSTGRES_DB: air_agent
      # PGDATA 必须在 volume 挂载点的子目录下，否则 initdb 因 lost+found 报错
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U air_agent -d air_agent"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 10s

  # Redis：官方 langgraph-api 镜像的 migration lock 硬依赖
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

  # NOTE: langgraph-api gated behind `profiles: [prod]`，本地开发不启动。
  #   全容器模式：container-compose up -d --build --profile prod
  langgraph-api:
    # 镜像需手动构建：container build -t air-agent/langgraph-api:latest .
    # （compose 的 build 有 builder 目录权限 bug，手动 build 更稳定）
    image: air-agent/langgraph-api:latest
    container_name: air-agent-langgraph-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    environment:
      # --- PostgreSQL ---
      # Go core-server 用 libpq 解析，不支持 postgresql+psycopg:// 前缀
      DATABASE_URI:  "postgresql://air_agent:air_agent_dev@postgres:5432/air_agent"
      POSTGRES_URI:  "postgresql://air_agent:air_agent_dev@postgres:5432/air_agent"

      # --- Redis（migration lock + broker）---
      REDIS_URI: "redis://redis:6379"

      # --- Store ---
      LANGGRAPH_STORE_BACKEND: "postgres"
      LANGGRAPH_STORE: '{"kind":"postgres","uri":"postgresql://air_agent:air_agent_dev@postgres:5432/air_agent"}'

      # --- Misc ---
      LANGGRAPH_API_URL: "http://localhost:2024"
      LANGGRAPH_AUTH_TYPE: "noop"
      DB_MIGRATION_BY_CORE_API: "false"

      # --- API keys（从 .env 注入）---
      LANGCHAIN_TRACING_V2: "${LANGCHAIN_TRACING_V2}"
      LANGCHAIN_API_KEY:    "${LANGCHAIN_API_KEY}"
      OPENAI_API_KEY:       "${OPENAI_API_KEY}"
      ARK_API_KEY:          "${ARK_API_KEY}"
      DASHSCOPE_API_KEY:    "${DASHSCOPE_API_KEY}"
    env_file:
      - .env
    volumes:
      # 本地代码挂载（镜像内 editable install，Python 直接读 /deps/air_agent/src）：
      # 改本地 src/ 后 `container restart air-agent-langgraph-api` 即生效，无需重建镜像
      - ./src:/deps/air_agent/src
    ports:
      - "2024:8000"
    profiles:
      - prod

volumes:
  pgdata:
