# ---------------------------------------------------------------------------
# Air Agent — Apple Container + Mcrich23/Container-Compose deployment spec
#
# Orchestration target: Apple Container (container CLI 1.2+) via
# `container-compose` (https://github.com/Mcrich23/Container-Compose).
# This project does NOT use Docker Desktop or docker compose.
#
# After the I4 database cutover, restart the separated local stack with:
#   .venv/bin/python deployment/run_separated_local.py start
# See deployment/SEPARATED_LOCAL.md. The launcher generates an application-only
# descriptor and pins inspected dependency addresses; it keeps PG/Redis intact.
#
# This descriptor supplies the launcher with the application definition.
# Full-stack compose commands are not the canonical local startup procedure;
# they can recreate dependencies without the current separated configuration.
# Use ./run-local.sh (the same launcher) for day-to-day startup.
# ---------------------------------------------------------------------------

name: air-agent

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: air_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private owner password for explicit provisioning}
      POSTGRES_DB: air_agent_business
      # PGDATA 必须在 volume 挂载点的子目录下，否则 initdb 因 lost+found 报错
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U air_agent -d air_agent_business"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 10s

  # Redis：官方 langgraph-api 镜像的 migration lock 硬依赖
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

  # NOTE: langgraph-api gated behind `profiles: [prod]`，本地开发不启动。
  #   全容器模式：container-compose up -d --build --profile prod
  langgraph-api:
    # 镜像需手动构建：container build -t air-agent/langgraph-api:latest .
    # （compose 的 build 有 builder 目录权限 bug，手动 build 更稳定）
    image: air-agent/langgraph-api:latest
    container_name: air-agent-langgraph-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    environment:
      # DB URIs come only from the private .env.langgraph file. Hardcoded
      # environment entries override env_file in Apple Container Compose and
      # could silently reconnect a migrated deployment to its frozen source.

      # Redis URI also comes from .env.langgraph; the separated launcher pins
      # it to the inspected dependency address instead of relying on VM DNS.

      # --- Store ---
      LANGGRAPH_STORE_BACKEND: "postgres"

      # --- Misc ---
      LANGGRAPH_API_URL: "http://localhost:2024"
      # 企业模式：原生 custom auth（运行票据 + 资源级授权）。noop 已退出。
      LANGGRAPH_AUTH_TYPE: "custom"
      LANGGRAPH_AUTH: '{"path":"/deps/air_agent/src/common/identity/langgraph_auth.py:auth","disable_studio_auth":true}'
      # 身份库运行角色连接（RLS 生效；与 admin API 同角色）
      # All native-process configuration comes from one complete env_file.
      # Apple Container Compose reads literal key=value lines (no shell quotes).
      # Keep host .env separate: its loopback URLs are invalid in the VM.
      RUNTIME_TICKET_AUDIENCE: "langgraph-runtime"
      LANGGRAPH_HTTP: '{"app":"/deps/air_agent/src/common/artifact_http.py:app"}'
      DB_MIGRATION_BY_CORE_API: "false"

      # --- API keys（从 .env 注入）---
      LANGCHAIN_TRACING_V2: "${LANGCHAIN_TRACING_V2}"
      LANGCHAIN_API_KEY:    "${LANGCHAIN_API_KEY}"
      LANGFUSE_ENABLED:     "${LANGFUSE_ENABLED:-false}"
      LANGFUSE_BASE_URL:    "${LANGFUSE_BASE_URL:-http://192.168.64.1:3001}"
      LANGFUSE_PUBLIC_KEY:  "${LANGFUSE_PUBLIC_KEY}"
      LANGFUSE_SECRET_KEY:  "${LANGFUSE_SECRET_KEY}"
      OPENAI_API_KEY:       "${OPENAI_API_KEY}"
      ARK_API_KEY:          "${ARK_API_KEY}"
      DASHSCOPE_API_KEY:    "${DASHSCOPE_API_KEY}"
    env_file:
      - .env.langgraph
    volumes:
      # 本地代码挂载（镜像内 editable install，Python 直接读 /deps/air_agent/src）：
      # 改本地 src/ 后 `container restart air-agent-langgraph-api` 即生效，无需重建镜像
      - ./src:/deps/air_agent/src
    ports:
      - "127.0.0.1:2024:8000"
    profiles:
      - prod

  # Langfuse v4 local observability stack. Keep its data and credentials
  # separate from the AirAgent/Lightrag PostgreSQL and Redis instances.
  # 内部依赖统一走宿主机桥地址 192.168.64.1 的端口映射（见 .env.langfuse）：
  # Apple Container 的 compose 服务名 DNS 在容器分批创建/宿主机 TUN 代理下不可靠，
  # 桥地址端口映射走内核直连路由，与容器批次无关。
  langfuse-postgres:
    image: postgres:17-alpine
    container_name: air-agent-langfuse-postgres
    restart: unless-stopped
    ports:
      - "15433:5432"
    env_file:
      - .env.langfuse
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    profiles:
      - observability

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    container_name: air-agent-langfuse-clickhouse
    restart: unless-stopped
    ports:
      - "18123:8123"
      - "18124:9000"
    env_file:
      - .env.langfuse
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    profiles:
      - observability

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    container_name: air-agent-langfuse-minio
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["sh"]
    command:
      - -c
      - mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data
    env_file:
      - .env.langfuse
    ports:
      - "19000:9000"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    profiles:
      - observability

  langfuse-redis:
    image: redis:7
    container_name: air-agent-langfuse-redis
    restart: unless-stopped
    ports:
      - "16380:6379"
    env_file:
      - .env.langfuse
    entrypoint: ["sh", "-c"]
    command:
      - exec redis-server --requirepass "$REDIS_AUTH" --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_AUTH\" ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    profiles:
      - observability

  langfuse-web:
    image: docker.io/langfuse/langfuse:4
    container_name: air-agent-langfuse-web
    restart: unless-stopped
    # Next.js server 启动峰值超过 container-compose 默认 1G 配额（OOM GC 崩溃）
    mem_limit: 2g
    depends_on:
      langfuse-postgres:
        condition: service_healthy
        restart: true
      langfuse-clickhouse:
        condition: service_healthy
        restart: true
      langfuse-minio:
        condition: service_healthy
        restart: true
      langfuse-redis:
        condition: service_healthy
        restart: true
    env_file:
      - .env.langfuse
    ports:
      - "3001:3000"
    # container-compose 并行创建服务，web 的镜像入口会先于 postgres/ClickHouse
    # 就绪而迁移失败（Prisma P1001）后退出。这里等待宿主桥端口（192.168.64.1
    # 上的 15433/18123，固定地址、与批次无关）就绪后再走镜像原生迁移+启动链。
    entrypoint: ["dumb-init", "--", "/bin/sh", "-c"]
    command:
      - >-
        i=0;
        until node -e 'require("net").connect(15433,"192.168.64.1",()=>process.exit(0)).on("error",()=>process.exit(1))' 2>/dev/null
        && node -e 'require("net").connect(18123,"192.168.64.1",()=>process.exit(0)).on("error",()=>process.exit(1))' 2>/dev/null; do
          [ $i -ge 120 ] && echo "prewarm: dependency ports not ready" && exit 1;
          echo "prewarm: waiting langfuse deps ($i)"; i=$((i+1)); sleep 2;
        done;
        exec ./web/entrypoint.sh /bin/sh -c 'if [ -n "$NEXT_PUBLIC_LANGFUSE_CLOUD_REGION" ]; then node --import dd-trace/initialize.mjs ./web/server.js --keepAliveTimeout 110000; else node ./web/server.js --keepAliveTimeout 110000; fi'
    profiles:
      - observability

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:4
    container_name: air-agent-langfuse-worker
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
        restart: true
      langfuse-clickhouse:
        condition: service_healthy
        restart: true
      langfuse-minio:
        condition: service_healthy
        restart: true
      langfuse-redis:
        condition: service_healthy
        restart: true
    env_file:
      - .env.langfuse
    profiles:
      - observability

volumes:
  pgdata:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
