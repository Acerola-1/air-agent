<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Air Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
  <!-- 防止暗色模式闪烁: 在 body 渲染前确定主题 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("air-agent:theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved || (prefersDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
  <!-- Markdown 渲染 + 代码高亮 (CDN, 浏览器缓存) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/common.min.js" defer></script>
</head>
<body>
  <!-- ==================== 左侧 Sidebar ==================== -->
  <aside class="sidebar" id="sidebar">
    <!-- 顶部:品牌 + 折叠按钮 -->
    <div class="sidebar-top">
      <div class="brand">
        <span class="brand-logo">🌀</span>
        <span class="brand-text">Air Agent</span>
      </div>
      <button id="collapse-btn" class="icon-btn ghost" title="折叠侧边栏 (Ctrl+B)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>
    </div>

    <!-- 新对话按钮 -->
    <button id="new-chat-btn" class="new-chat-btn" title="新对话 (Ctrl+K)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>新对话</span>
    </button>

    <!-- 搜索框 -->
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="search-input" type="text" placeholder="搜索对话" />
    </div>

    <!-- 历史列表 (按时间分组) -->
    <div class="thread-list-wrapper">
      <ul id="thread-list" class="thread-list">
        <li class="thread-empty">暂无历史</li>
      </ul>
    </div>

    <!-- 底部:用户信息 + 主题切换 -->
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">U</div>
        <div class="user-meta">
          <div class="user-name">本地用户</div>
          <div class="user-thread" id="thread-id-display" title="">—</div>
        </div>
      </div>
      <button id="theme-btn" class="icon-btn ghost" title="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </aside>

  <!-- 侧边栏折叠时的遮罩 (移动端) -->
  <div id="sidebar-mask" class="sidebar-mask"></div>

  <!-- ==================== 中间主区 ==================== -->
  <main class="main">
    <!-- 顶栏:侧边栏切换 + 图选择器 + 操作 -->
    <header class="main-header">
      <button id="sidebar-toggle" class="icon-btn ghost" title="侧边栏 (Ctrl+B)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <!-- 图选择器 (ChatGPT model picker 风格) -->
      <div class="graph-picker" id="graph-picker">
        <button id="graph-current" class="graph-current" type="button">
          <span class="graph-current-name" id="graph-current-name">basic-qa</span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="graph-dropdown" id="graph-dropdown" hidden>
          <div class="graph-dropdown-header">选择图</div>
          <ul id="graph-options" class="graph-options"></ul>
        </div>
      </div>

      <div class="header-actions">
        <button id="new-chat-top" class="icon-btn ghost" title="新对话 (Ctrl+K)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- 消息列表 -->
    <div id="messages" class="messages">
      <!-- 空状态 -->
      <div class="empty-state" id="empty-state">
        <div class="empty-logo">🌀</div>
        <h1 class="empty-title">欢迎使用 Air Agent</h1>
        <p class="empty-subtitle">选择上方的图,输入问题开始对话</p>
        <div class="empty-suggestions" id="empty-suggestions">
          <button class="suggestion-card" data-q="今天北京的空气质量怎么样?">
            <div class="suggestion-icon">📊</div>
            <div class="suggestion-text">查询今日空气质量</div>
          </button>
          <button class="suggestion-card" data-q="对比本月北京和上海 PM2.5 浓度趋势">
            <div class="suggestion-icon">📈</div>
            <div class="suggestion-text">多城市趋势对比</div>
          </button>
          <button class="suggestion-card" data-q="哪个区域 NO2 浓度最高?">
            <div class="suggestion-icon">🏆</div>
            <div class="suggestion-text">区域污染排名</div>
          </button>
          <button class="suggestion-card" data-q="生成上周空气质量月报">
            <div class="suggestion-icon">📄</div>
            <div class="suggestion-text">生成分析报告</div>
          </button>
        </div>
      </div>
    </div>

    <!-- 滚动到底部按钮 -->
    <button id="scroll-bottom-btn" class="scroll-bottom-btn" hidden title="滚动到底部">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>

    <!-- 输入栏 -->
    <div class="input-bar">
      <div class="input-wrap">
        <textarea
          id="input"
          rows="1"
          placeholder="发送消息"
        ></textarea>
        <button id="send-btn" class="send-btn" disabled title="发送 (Enter)">
          <svg class="icon-send" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          <svg class="icon-stop" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <rect x="6" y="6" width="12" height="12" rx="2"></rect>
          </svg>
        </button>
      </div>
      <div class="input-hint">
        <span>Air Agent 可能会出错,请核查重要信息</span>
      </div>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
